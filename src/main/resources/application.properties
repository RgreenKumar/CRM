spring.application.name=scalecrm
# H2 In-Memory Database Configuration (Temporary fallback)
spring.datasource.url=jdbc:h2:mem:crmdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true

# Security
jwt.secret=94a08da1fecbb6e8b46990538c7b50b25e2439366d21f8a8462002364e1c5dbb
jwt.expiration=86400000

# Error Handling (Custom mapping for frontend routes)
spring.web.resources.add-mappings=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
