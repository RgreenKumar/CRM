spring.application.name=scalecrm
spring.datasource.url=jdbc:h2:file:./data/crmdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security
jwt.secret=94a08da1fecbb6e8b46990538c7b50b25e2439366d21f8a8462002364e1c5dbb
jwt.expiration=86400000

# Error Handling (Custom mapping for frontend routes)
spring.web.resources.add-mappings=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
